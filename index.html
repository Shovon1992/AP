<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Applicant Submission</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

.container {
    max-width: 600px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

input[readonly] {
    background: #f1f3f5;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 6px;
    background: #1976d2;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #125ca5;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    padding: 12px;
    border-radius: 6px;
    display: none;
    text-align: center;
}

.success {
    background: #e8f5e9;
    color: #2e7d32;
}

.error {
    background: #ffebee;
    color: #c62828;
}

.loading {
    background: #fff8e1;
    color: #856404;
}
</style>
</head>

<body>

<div class="container">

<h2>Applicant Submission</h2>

<form id="applicantForm">

    <label for="applicationNo">
        Application No.
    </label>

    <input
        type="text"
        id="applicationNo"
        placeholder="Enter Application No."
        autocomplete="off"
    >


    <label for="mobile">
        Mobile No.
    </label>

    <input
        type="tel"
        id="mobile"
        placeholder="Enter Mobile No."
        maxlength="10"
        inputmode="numeric"
        autocomplete="off"
    >


    <label for="name">
        Applicant Name
    </label>

    <input
        type="text"
        id="name"
        readonly
    >


    <label for="district">
        District
    </label>

    <input
        type="text"
        id="district"
        readonly
    >


    <label for="block">
        Block / Municipality
    </label>

    <input
        type="text"
        id="block"
        readonly
    >


    <label for="gp">
        GP / Ward
    </label>

    <input
        type="text"
        id="gp"
        readonly
    >


    <label for="ac">
        AC
    </label>

    <input
        type="text"
        id="ac"
        placeholder="Enter AC"
        required
    >


    <label for="remarks">
        Remarks
    </label>

    <textarea
        id="remarks"
        placeholder="Enter remarks"
    ></textarea>


    <button type="submit" id="submitButton">
        Submit
    </button>

</form>

<div id="message"></div>

</div>

<script src="app.js"></script>

</body>
</html>
