<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Applicant Search</title>

		<style>
			body {
				font-family: Arial, sans-serif;
				max-width: 600px;
				margin: 40px auto;
				padding: 20px;
			}

			input {
				width: 100%;
				padding: 14px;
				font-size: 18px;
				box-sizing: border-box;
				margin-bottom: 10px;
			}

			button {
				width: 100%;
				padding: 14px;
				font-size: 18px;
				cursor: pointer;
			}

			#result {
				margin-top: 20px;
			}

			.card {
				border: 1px solid #ddd;
				padding: 15px;
				border-radius: 8px;
				line-height: 1.8;
			}

			.error {
				color: red;
			}
		</style>
	</head>

	<body>
		<h2>Applicant Search</h2>

		<input type="text" id="search" placeholder="Application No. or Mobile" autocomplete="off" />

		<button onclick="searchApplicant()">Search</button>

		<div id="result"></div>

		<script src="./app.js"></script>
	</body>
</html>
